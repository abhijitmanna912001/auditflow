name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check (agents + evaluation)
        run: python -m py_compile agents/*.py evaluation/*.py

      - name: Validate benchmark dataset ground truth
        working-directory: evaluation
        run: |
          python -c "
          from evaluate import load_ground_truth
          cases = load_ground_truth('../dataset')
          print(f'Validated {len(cases)} ground-truth case(s) OK')
          "

      - name: Run agent unit tests
        run: pytest agents/ -v
