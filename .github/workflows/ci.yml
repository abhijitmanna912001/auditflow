name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check (agents + connectors + evaluation)
        run: python -m py_compile agents/*.py connectors/*.py evaluation/*.py

      - name: Validate benchmark dataset ground truth
        working-directory: evaluation
        run: |
          python -c "
          from evaluate import load_ground_truth
          cases = load_ground_truth('../dataset')
          print(f'Validated {len(cases)} ground-truth case(s) OK')
          "

      - name: Run agent unit tests
        run: pytest agents/ connectors/ -v

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # No NEXT_PUBLIC_GOOGLE_* values here, so this also checks the build
      # with the Drive button switched off.
      - name: Build
        run: npm run build
